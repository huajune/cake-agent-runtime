name: Codex Review Approval

on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
    branches: [develop]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Recheck official Codex review and approve only if verified'
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: codex-approval-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request &&
         github.event.comment.user.id == 199175422 &&
         github.event.sender.id == 199175422))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never check out a PR head or execute PR-controlled scripts with the write token.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/codex-review-approval.js
          sparse-checkout-cone-mode: false
      - name: Verify native Codex evidence and submit formal review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
        run: node scripts/codex-review-approval.js --apply
