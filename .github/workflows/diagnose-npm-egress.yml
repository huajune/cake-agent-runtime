name: Diagnose npm Egress

# 临时排障工作流。v10.41.0 / v10.42.0 连续三次部署都挂在 Dockerfile 第 9 步
# `npm install -g pnpm` 的 `read ETIMEDOUT`（registry.npmjs.org）上。
# v10.42.0 已验证 `docker build --network=host` 无效——构建走宿主机网络命名空间
# 仍然同样失败，说明问题不在 docker0 网桥，而在宿主机自身出站。
#
# 本工作流用于把「到底哪条出站通、哪条不通」测死，取代继续猜测。
#
# ⚠️ 纯只读：不创建容器、不创建网络、不重启服务、不修改任何配置，
#    不触碰运行中的容器（该宿主机上另有 11 个无关容器）。
#    `systemctl show` 是查询命令，不是 restart。
#    所有 curl 均带 --max-time 上限并丢弃响应体。
#
# ⚠️ 本工作流持有生产机 SSH 执行权限，定位完成后必须立即删除。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Probe outbound reachability
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Probe from production host (read-only)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          command_timeout: 8m
          script: |
            # 单条失败不中断，要的是完整画像
            set +e

            probe() {
              # $1=标签 $2=URL
              curl -sS -o /dev/null \
                -w "$1: HTTP %{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n" \
                --max-time 45 "$2" || echo "$1: 失败 rc=$?"
            }

            echo "===== 1. DNS 解析 ====="
            echo "-- registry.npmjs.org --"
            getent hosts registry.npmjs.org || echo "(解析失败)"
            echo "-- registry.npmmirror.com --"
            getent hosts registry.npmmirror.com || echo "(解析失败)"

            echo "===== 2. 目标源：npmjs（三次失败的元凶）====="
            probe "npmjs" "https://registry.npmjs.org/pnpm"

            echo "===== 3. 候选源：npmmirror（决定镜像源方案是否成立）====="
            probe "npmmirror" "https://registry.npmmirror.com/pnpm"

            echo "===== 4. 通用出站对照（判断是整机没网还是只断 npmjs）====="
            probe "github-api" "https://api.github.com"
            probe "dockerhub" "https://registry-1.docker.io/v2/"

            echo "===== 5. 代理与 Docker 配置 ====="
            echo "-- shell proxy 变量 --"
            env | grep -iE 'proxy' || echo "(无 proxy 环境变量)"
            echo "-- docker 服务 Environment（show 为查询，非 restart）--"
            systemctl show docker --property=Environment
            echo "-- /etc/docker/daemon.json --"
            cat /etc/docker/daemon.json 2>/dev/null || echo "(不存在)"

            echo "===== 诊断结束（未做任何写操作）====="
