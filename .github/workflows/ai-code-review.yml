name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
  # GITHUB_TOKEN 创建的 bot PR 不触发 pull_request，保留人工/发布流程的补跑入口。
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  ai-code-review:
    if: >
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.pull_request.head.ref, 'chore/release-metadata/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 只选择一个提供方；Claude 恢复后改仓库变量即可切回。
      AI_REVIEW_PROVIDER: ${{ vars.AI_REVIEW_PROVIDER || 'gpt' }}
    steps:
      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Invalid PR number'; exit 1; }
          PR_JSON=$(gh pr view "$PR_NUMBER" --json headRefOid,baseRefOid,state)
          HEAD_SHA=$(jq -r .headRefOid <<< "$PR_JSON")
          BASE_SHA=$(jq -r .baseRefOid <<< "$PR_JSON")
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ && "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ $(jq -r .state <<< "$PR_JSON") == OPEN ]]
          if [ -n "$EVENT_HEAD_SHA" ] && [ "$EVENT_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo '::error::PR HEAD changed; use the latest workflow run.'
            exit 1
          fi
          # 评审规则、schema 和发布脚本与 workflow 一样，不能由 PR 修改后自审放行。
          FILES=$(gh api --paginate --slurp "repos/${GH_REPO}/pulls/${PR_NUMBER}/files?per_page=100")
          WORKFLOW_CHANGED=$(jq 'any(.[][]; .filename == ".github/workflows/ai-code-review.yml" or .filename == ".github/review-rules.md" or .filename == ".github/ai-review.schema.json" or .filename == "scripts/ai-code-review.js")' <<< "$FILES")
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "workflow_changed=$WORKFLOW_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head_sha }}
          persist-credentials: false

      - name: Prepare shared review request
        id: request
        if: steps.pr.outputs.workflow_changed == 'false'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const env = process.env;
          const prompt = [
            `REPO: ${env.GITHUB_REPOSITORY}`,
            `PR NUMBER: ${env.PR_NUMBER}`,
            `CURRENT HEAD SHA: ${env.HEAD_SHA}`,
            `BASE SHA: ${env.BASE_SHA}`,
            '',
            'Review only the diff from the merge base of BASE SHA and CURRENT HEAD to CURRENT HEAD.',
            'Prioritize Critical rules. Inspect related code only when necessary to verify findings.',
            'Use at most 60 tool calls and reserve time to return the required JSON result.',
            '',
            fs.readFileSync('.github/review-rules.md', 'utf8'),
          ].join('\n');
          const delimiter = require('node:crypto').randomUUID();
          fs.appendFileSync(env.GITHUB_OUTPUT, `prompt<<${delimiter}\n${prompt}\n${delimiter}\n`);
          const schema = JSON.stringify(JSON.parse(fs.readFileSync('.github/ai-review.schema.json', 'utf8')));
          fs.appendFileSync(env.GITHUB_OUTPUT, `schema=${schema}\n`);
          NODE

      - name: Check selected reviewer credentials
        id: credentials
        if: steps.pr.outputs.workflow_changed == 'false'
        env:
          OPENAI_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
          CLAUDE_KEY_PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          case "$AI_REVIEW_PROVIDER" in
            gpt)
              [ "$OPENAI_KEY_PRESENT" = true ] || { echo '::error::Configure repository Secret OPENAI_API_KEY for GPT review.'; exit 1; }
              ;;
            claude)
              [ "$CLAUDE_KEY_PRESENT" = true ] || { echo '::error::Configure repository Secret CLAUDE_CODE_OAUTH_TOKEN for Claude review.'; exit 1; }
              ;;
            *) echo '::error::AI_REVIEW_PROVIDER must be gpt or claude.'; exit 1 ;;
          esac

      - name: Review current HEAD with GPT
        id: gpt
        if: steps.pr.outputs.workflow_changed == 'false' && env.AI_REVIEW_PROVIDER == 'gpt'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        continue-on-error: true
        timeout-minutes: 20
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ vars.AI_REVIEW_GPT_ENDPOINT }}
          model: ${{ vars.AI_REVIEW_GPT_MODEL }}
          prompt: ${{ steps.request.outputs.prompt }}
          output-schema-file: .github/ai-review.schema.json
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          allow-bots: true

      - name: Review current HEAD with Claude
        id: claude
        if: steps.pr.outputs.workflow_changed == 'false' && env.AI_REVIEW_PROVIDER == 'claude'
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        timeout-minutes: 20
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.request.outputs.prompt }}
          claude_args: |
            --max-turns 80
            --json-schema '${{ steps.request.outputs.schema }}'
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(git grep:*),Bash(git cat-file:*),Bash(git branch:*)"

      - name: Submit deterministic review or fail closed
        if: ${{ !cancelled() && steps.pr.outputs.workflow_changed == 'false' && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPT_OUTCOME: ${{ steps.gpt.outcome }}
          GPT_REVIEW_JSON: ${{ steps.gpt.outputs.final-message }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          CLAUDE_REVIEW_JSON: ${{ steps.claude.outputs.structured_output }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: node scripts/ai-code-review.js

      - name: Require human review for review infrastructure changes
        if: steps.pr.outputs.workflow_changed == 'true'
        run: |
          echo '::warning::AI review skipped because this PR modifies review infrastructure; human review is required.'
