packages:
  - 'web'

minimumReleaseAge: 1440
blockExoticSubdeps: true
strictDepBuilds: true

# Keep dependency lifecycle scripts denied unless a reviewed package genuinely
# requires one. strictDepBuilds makes every new, unreviewed script fail install.
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  esbuild: false
  msgpackr-extract: false
  nodejieba: false
  supabase: false
