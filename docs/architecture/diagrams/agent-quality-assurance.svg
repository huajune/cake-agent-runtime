  <text x="748" y="256" fill="#e67700" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="0"><tspan x="748" dy="0">守卫检查</tspan></text>
  <text x="704" y="300" fill="#495057" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0"><tspan x="704" dy="0">事实对账 · 承诺校验 · 风险拦截</tspan></text>
  <rect x="978" y="220" width="230" height="112" rx="14" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2" filter="url(#soft-shadow)"/>
