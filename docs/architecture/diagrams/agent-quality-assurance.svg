  <text x="1115" y="611" fill="#2f9e44" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0"><tspan x="1115" dy="0">每天 06:00</tspan></text>
  <rect x="80" y="632" width="620" height="164" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" filter="url(#soft-shadow)"/>
