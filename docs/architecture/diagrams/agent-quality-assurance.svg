  <text x="410" y="300" fill="#495057" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0"><tspan x="410" dy="0">结合岗位库与会话信息</tspan></text>
