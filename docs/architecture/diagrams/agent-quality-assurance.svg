  <text x="108" y="726" fill="#343a40" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0"><tspan x="108" dy="0">9 个维度扫描前一天全部对话</tspan><tspan x="108" dy="23.2">输出问题清单并与前一天环比</tspan><tspan x="108" dy="23.2">连续出问题的会话自动提高优先级</tspan></text>
