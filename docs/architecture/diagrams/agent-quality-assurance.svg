  <text x="768" y="1199" fill="#495057" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0"><tspan x="768" dy="0">修复进展自动写入；运营订阅后可及时收到更新</tspan></text>
