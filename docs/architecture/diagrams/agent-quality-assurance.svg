  <text x="518" y="372" fill="#7c4a03" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0"><tspan x="518" dy="0">编造薪资/门店、假称“已报名”“已发邀请”等内容，会在发出前被拦截或改写</tspan></text>
  <rect x="60" y="435" width="1320" height="108" rx="14" fill="#edf2ff" stroke="#364fc7" stroke-width="2" filter="url(#soft-shadow)"/>
