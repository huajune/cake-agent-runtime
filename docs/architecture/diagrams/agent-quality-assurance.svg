  <text x="100" y="508" fill="#495057" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0"><tspan x="100" dy="0">每轮对话内容、岗位查询、检查结果与最终回复均可逐条回溯，为巡检和修复提供证据链</tspan></text>
  <text x="1188" y="487" fill="#364fc7" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0"><tspan x="1188" dy="0">完整可追溯</tspan></text>
