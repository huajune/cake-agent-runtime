  <text x="108" y="1199" fill="#495057" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0"><tspan x="108" dy="0">下次巡检自动带上（现有 ⑥⑦⑨ 即由此沉淀）</tspan></text>
