  <text x="1006" y="922" fill="#e8590c" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0"><tspan x="1006" dy="0">每天 07:00</tspan></text>
  <text x="310" y="975" fill="#343a40" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="0"><tspan x="310" dy="0">汇总巡检清单 + BadCase 未解决项  →  逐条根因分析  →  按风险分流  →  自动回写处理状态</tspan></text>
