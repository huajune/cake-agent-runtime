  <text x="116" y="300" fill="#495057" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0"><tspan x="116" dy="0">进入 Agent 对话上下文</tspan></text>
