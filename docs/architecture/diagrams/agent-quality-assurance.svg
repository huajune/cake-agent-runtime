  <text x="768" y="726" fill="#343a40" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0"><tspan x="768" dy="0">补充系统尚未识别的问题</tspan><tspan x="768" dy="23.2">统一填入 BadCase 表</tspan><tspan x="768" dy="23.2">无需在群里 @，修复环会自动领取</tspan></text>
